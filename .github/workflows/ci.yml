name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: 安装依赖（锁定版本）
        run: pip install -r requirements-dev.txt
      - name: 单元测试
        run: python -m pytest -q
      - name: Mock 冒烟（不调用 LLM）
        run: python -m litreview.cli screen --config config.yaml --mock --limit 5
