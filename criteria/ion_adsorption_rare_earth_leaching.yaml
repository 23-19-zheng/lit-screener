# 稀土判据包（主题：风化壳离子型稀土矿浸出）
pack: ion_adsorption_rare_earth_leaching
domain: 稀土资源与湿法冶金
description: >
  风化壳离子型稀土矿（离子吸附型稀土矿）浸出研究筛选判据。目标：找出以
  离子型稀土矿为原料、研究稀土浸出过程并以研究论文形式发表的文献。

criteria:
  - id: T1
    name: 研究对象
    question: 研究对象是否为天然风化壳离子吸附型稀土矿（离子型稀土矿）？
    guidance: |
      纳入：
        - 风化壳离子型稀土矿、离子吸附型稀土矿、离子型稀土矿
        - 来自风化壳矿床，且论文明确将样品界定为离子吸附型稀土矿
        - 样品中的稀土主要以可交换离子形式吸附于黏土矿物表面
      排除：
        - 原生岩浆型、碳酸盐型、磷酸盐型或独居石等非离子吸附型稀土矿
        - 稀土二次资源、废旧磁体、荧光粉、冶炼渣或工业废液
        - 仅使用普通黏土、纯矿物、合成吸附剂、离子交换树脂或模拟溶液，未使用天然离子型稀土矿样品
        - 仅研究与离子型稀土矿无关的矿物、材料或地球化学体系
        - “ion-adsorption”或“rare earth”仅出现在背景、关键词或对比讨论中
      边界（拿不准时回答 No 并在理由中说明）：
        - 样品来自风化壳矿床，且论文明确证明稀土主要以可交换离子形态吸附于黏土 → Yes
        - 仅标注来自稀土矿区但未确认属于离子吸附型稀土矿 → No
        - 离子型稀土矿与其他矿石混合，且无法确认研究样品的类型 → No

  - id: T2
    name: 技术路线
    question: 是否以离子型稀土矿中稀土的浸出、解吸或离子交换浸取为研究主体？
    guidance: |
      纳入：
        - 盐溶液浸出、离子交换浸出、酸浸、复合浸出剂浸出
        - 浸出剂种类、浓度、液固比、温度、时间、搅拌、渗透方式等条件优化
        - 堆浸、原地浸出、柱浸、搅拌浸出、强化浸出及浸出动力学研究
        - 报告稀土浸出率、浸出选择性、浸出液组成或相关定量结果
      排除：
        - 仅进行采矿、剥离、破碎、筛分、矿物学表征或资源量评价，未研究浸出
        - 仅研究浸出液后续萃取、沉淀、分离，未涉及离子型稀土矿的浸出过程
        - 纯环境影响、生态风险或生命周期评价，未提供浸出实验
        - 仅研究污染物、放射性元素或伴生金属的环境浸出，未以稀土浸出为目标
      边界：
        - 同时研究浸出液净化或稀土分离，只要包含离子型稀土矿浸出实验 → Yes
        - 以模型、动力学或模拟为辅助手段但有浸出实验验证 → Yes；纯计算无实验 → No

  - id: T3
    name: 研究类型
    question: 是否为有原始实验数据的同行评审期刊研究论文（original research article）？
    guidance: |
      纳入：
        - 同行评审期刊发表的研究论文，或数据库文献类型明确为 Article
        - 提供离子型稀土矿浸出实验的原始数据、方法、结果或定量分析
      排除：
        - 综述（review）、系统综述、评论（comment）、观点（perspective）或书章
        - 会议摘要、会议论文、社论、新闻、学位论文或专利
        - 纯建模、模拟、理论推导或数据库研究，未提供浸出实验数据
      说明：只要短通讯等期刊文章包含完整的离子型稀土矿浸出原始数据，即可纳入。
            论文同时包含浸出液净化、稀土分离或环境评价内容时，只要主体包含
            离子型稀土矿浸出实验并满足 T1/T2，本判据回答 Yes。
