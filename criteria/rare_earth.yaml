# 稀土判据包（示例主题：稀土二次资源回收）
#
# 使用方法：
#   - 在 config.yaml 的 criteria.active 中选择本次启用的判据子集
#   - 修改/增删条目即可适配其他稀土子领域（萃取分离、磁材、发光材料等）
#   - guidance 中务必写清"纳入/排除"边界——边界越明确，LLM 筛选越准
#     （原论文消融实验：结构化判据是精度的主要来源，RAG 仅是增量）

pack: rare_earth_recovery
domain: 稀土与材料（冶金与材料工程）
description: >
  稀土元素（REE）二次资源回收研究筛选判据。目标：找出以稀土元素本身的
  回收/分离/提取/纯化为研究对象、提供原始实验数据的文献。

criteria:
  - id: T1
    name: 研究对象
    question: >
      研究对象是否为稀土元素（Sc、Y 及 La-Lu 共 17 种）本身的回收、分离、
      提取、纯化或富集？
    guidance: |
      纳入：
        - 稀土浸出、萃取分离、沉淀、离子交换、选择性吸附回收稀土
        - 废旧 NdFeB 磁体、荧光粉、镍氢电池、抛光粉等二次资源中回收稀土
        - 稀土尾矿/浸出渣中稀土的再富集
      排除：
        - 稀土仅作为掺杂剂、稳定剂、载体、助催化剂出现，且回收稀土不是研究目的
          （如 CeO2 作为催化载体、La 掺杂电极材料）
        - "rare earth" 仅出现在关键词堆砌或引言背景中，实际研究体系是其他金属
        - 稀土功能材料的性能研究（如磁体、荧光体的性能优化）而非其回收
      边界（拿不准时回答 No 并在理由中说明）：
        - 回收过程中涉及铁/钴等伴生金属，但稀土回收是明确目标之一 → Yes
        - 仅做稀土元素的分布赋存表征、未涉及回收分离过程 → No

  - id: T2
    name: 技术路线
    question: 是否针对二次资源（废弃物/废料/尾矿/废旧产品）或含稀土料液的回收工艺？
    guidance: |
      纳入：
        - 湿法冶金：酸/碱浸出、溶剂萃取、离子交换、沉淀结晶
        - 火法/热处理：熔盐电解、氢破碎（HD）、热分解预处理
        - 直接再利用：磁体晶界扩散修复、荧光粉再生
        - 生物浸出、电化学回收等新型工艺
      排除：
        - 原生矿的采矿、选矿、破碎等物理预处理（未涉及稀土的化学分离富集）
        - 纯材料合成研究（以稀土化合物为原料做新材料，而非回收）
        - 纯环境评估/生命周期评价（LCA），无回收工艺本身
      边界：
        - 原矿浸出提稀土属于提取冶金，是否纳入取决于研究目的：
          若明确面向矿石提稀土流程 → 在此判据上回答 No（属原生资源），
          但若该判据未启用则不影响整体判定
        - DFT/分子模拟为辅助手段但有实验验证 → Yes；纯计算无实验 → No

  - id: T3
    name: 研究类型
    question: 是否为提供原始数据的实验研究？
    guidance: |
      纳入：实验测定（浸出率、萃取分配比、回收率、纯度、收率等定量结果）
      排除：
        - 综述（review）、评论（comment）、观点（perspective）
        - 纯建模/模拟研究（无实验验证）
        - 会议摘要、社论
      说明：含 LCA 但同时有实验回收工艺的研究，本判据应答 Yes；
            是否排除 LCA 由 T2 决定。
