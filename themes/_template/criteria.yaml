# 主题判据包模板
#
# 写法要点（结构化判据是筛选精度的主要来源）：
#   1. 每条判据只问一个可由标题+摘要判定的问题；
#   2. guidance 务必分"纳入 / 排除 / 边界"三段写清——边界越明确，LLM 判定越准；
#   3. 边界拿不准的情形要给出默认动作（通常从严答 No 并说明）；
#   4. 判据条数不限，config 的 criteria.active 可选子集，inclusion_logic 支持 all/any。
#
# 用法：
#   python -m litreview.cli new-theme themes/<你的主题>   # 复制本目录后编辑此文件

pack: my_topic
domain: 你的研究领域（如"污水生物处理与脱氮（环境工程）"）   # 用于评审 system prompt 的领域身份
description: >
  一句话说明本主题要筛什么样的文献（研究对象 / 技术路线 / 研究类型……）。

criteria:
  - id: C1
    name: 研究对象
    question: >
      用一个可由标题+摘要回答的疑问句描述本判据。
    guidance: |
      纳入：
        - 正例情形一（列出典型术语/工艺/对象）
        - 正例情形二
      排除：
        - 反例情形一（易混情形务必写明）
        - 反例情形二
      边界（拿不准时按此默认动作处理，并在理由中说明）：
        - 情形 → Yes/No

  - id: C2
    name: 研究类型
    question: 是否为提供原始数据的研究性论文（非综述/评论/会议摘要）？
    guidance: |
      纳入：
        - 实验研究、建模/模拟研究（按需决定是否要求实验验证）
      排除：
        - 综述（review）、评论（comment）、观点（perspective）、书章、会议摘要、社论
      边界：
        - 会议全文（proceedings paper）含数据 → 视主题需要决定 Yes/No
